<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Pro Ultra - Mega Sena</title>
    <style>
        :root { --bg-main: #06101E; --card-bg: #0F2035; --input-bg: #0A1624; --mega-green: #209869; --accent-gold: #FFD700; --text-main: #FFFFFF; --text-dim: #8E9EAF; --border: #1E344F; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); margin: 0; display: flex; justify-content: center; }
        .view { width: 100%; max-width: 440px; min-height: 100vh; display: flex; flex-direction: column; padding: 24px; }
        .hidden { display: none !important; }
        .brand-container { text-align: center; margin-top: 10px; margin-bottom: 20px; }
        .logo-svg { width: 140px; height: auto; margin-bottom: 5px; }
        h1 { font-size: 22px; font-weight: 800; text-align: center; margin: 0; }
        .subtitle { color: var(--text-dim); text-align: center; font-size: 13px; margin: 4px 0 0 0; }
        .input-group { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--mega-green); text-transform: uppercase; margin-bottom: 6px; }
        select, input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: #ffffff; padding: 12px; font-size: 16px; outline: none; -webkit-appearance: none; }
        .live-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-card { background: var(--card-bg); border-radius: 14px; padding: 14px; text-align: center; border: 1px solid var(--border); }
        .stat-value { font-size: 20px; font-weight: 800; color: var(--accent-gold); display: block; }
        .stat-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }
        .prob-efficiency { margin-top: 14px; padding: 12px; background: rgba(32, 152, 105, 0.12); border-left: 4px solid var(--mega-green); border-radius: 8px; font-size: 12px; line-height: 1.5; }
        .btn-generate { background: linear-gradient(135deg, #25ba82, #209869); color: #ffffff; border: none; border-radius: 14px; padding: 16px; width: 100%; font-weight: 700; margin-top: 20px; cursor: pointer; }
        .btn-skip { background: linear-gradient(135deg, #ffcc00, #d4af37); color: #06101E; border: none; border-radius: 10px; padding: 10px 16px; font-size: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-results { background: transparent; color: var(--text-dim); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-top: 12px; width: 100%; cursor: pointer; }
        .results-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-top: 14px; }
        .result-row { padding: 14px 0; border-bottom: 1px solid rgba(30, 52, 79, 0.5); }
        .balls-container { display: flex; flex-wrap: wrap; gap: 10px; min-height: 42px; align-items: center; }
        .ball { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #FFFFFF; font-size: 15px; box-shadow: inset 0 -4px 8px rgba(0,0,0,0.4); position: relative; }
        .globo-container { width: 120px; height: 120px; border: 4px solid #e5e5e5; border-radius: 50%; margin: 20px auto; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), rgba(0,0,0,0.4)); display: flex; align-items: center; justify-content: center; position: relative; }
        .globo-blur { width: 90px; height: 90px; border-radius: 50%; animation: girarGlobo 0.6s linear infinite; }
        .turbo { animation: girarGlobo 0.1s linear infinite !important; }
        @keyframes girarGlobo { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .game-card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-top: 14px; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div id="homeView" class="view">
        <div class="brand-container">
            <svg class="logo-svg" viewBox="0 0 300 90" xmlns="http://www.w3.org/2000/svg">
                <circle cx="45" cy="45" r="35" fill="#209869"/><path d="M 45 18 C 38 18 35 25 45 35 C 55 25 52 18 45 18 Z M 45 72 C 52 72 55 65 45 55 C 35 65 38 72 45 72 Z M 18 45 C 18 52 25 55 35 45 C 25 35 18 38 18 45 Z M 72 45 C 72 38 65 35 55 45 C 65 55 72 52 72 45 Z" fill="#ffffff"/><circle cx="45" cy="45" r="5" fill="#209869"/><text x="95" y="42" font-family="Arial Black" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-1">MEGA</text><text x="95" y="76" font-family="Arial Black" font-size="34" font-weight="900" fill="#209869" letter-spacing="-1">SENA</text>
            </svg>
            <h1>Sistema Pro Ultra</h1>
        </div>
        <div class="input-group">
            <label>Tipo de Jogo</label>
            <select id="tipoJogo" onchange="calcularTempoReal()"><option value="6">6 Dezenas</option><option value="7">7 Dezenas</option></select>
        </div>
        <div class="input-group">
            <label>Investimento (R$)</label>
            <input type="number" id="valorInput" placeholder="Valor (Ex: 70)" oninput="calcularTempoReal()">
        </div>
        <button class="btn-generate" onclick="irParaSorteio()">GERAR MEUS JOGOS</button>
        <button class="btn-results" onclick="alternarResultados()">Ver últimos resultados</button>
        <div id="panelResults" class="results-panel hidden">
            <div id="listaResultados"></div>
        </div>
    </div>

    <div id="loadingView" class="view hidden">
        <div class="globo-container"><div class="globo-blur" id="globoAlvo"></div></div>
        <div id="statusTexto" style="text-align:center; color:white;">Misturando...</div>
        <button class="btn-skip" onclick="pularSorteioCompleto()">Revelar Tudo</button>
    </div>

    <div id="gamesView" class="view hidden">
        <div id="gamesList"></div>
    </div>

    <script>
        const PRECO_6 = 6.00; const PRECO_7 = 35.00; let jogosGeradosCache = [];
        
        function calcularTempoReal() {
            const t = parseInt(document.getElementById('tipoJogo').value);
            const v = parseFloat(document.getElementById('valorInput').value) || 0;
            const total = Math.floor(v / (t === 7 ? PRECO_7 : PRECO_6));
            document.getElementById('resJogos').innerText = total;
        }

        async function alternarResultados() {
            const panel = document.getElementById('panelResults');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                const res = await fetch("https://loteriascaixa-api.herokuapp.com/api/megasena");
                const dados = await res.json();
                document.getElementById('listaResultados').innerHTML = dados.slice(0,5).map(c => 
                    `<div class='result-row'>Concurso ${c.concurso}: ${c.dezenas.join(', ')}</div>`).join('');
            }
        }

        function irParaSorteio() {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('loadingView').classList.remove('hidden');
            // Aqui entra toda a sua lógica de sorteio original...
            setTimeout(() => renderizarPainelFinal(), 2000);
        }

        function renderizarPainelFinal() {
            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('gamesView').classList.remove('hidden');
        }
    </script>
</body>
</html>
