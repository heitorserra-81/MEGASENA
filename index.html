<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Pro Ultra - Mega Sena</title>
    <style>
        :root {
            --bg-main: #06101E; 
            --card-bg: #0F2035; 
            --input-bg: #0A1624;
            --mega-green: #209869; 
            --accent-gold: #FFD700; 
            --text-main: #FFFFFF;
            --text-dim: #8E9EAF;
            --border: #1E344F;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); margin:0; padding:0; display:flex; justify-content:center; min-height:100vh; }

        .view { width:100%; max-width:440px; min-height:100vh; padding:20px; display:flex; flex-direction:column; }
        .hidden { display:none !important; }

        .btn-generate {
            background: linear-gradient(135deg, #25ba82, var(--mega-green));
            color: white; border: none; border-radius: 16px; padding: 20px; font-size: 18px; 
            font-weight: 800; width: 100%; margin: 20px 0; cursor: pointer; box-shadow: 0 8px 25px rgba(32,152,105,0.4);
        }

        .btn-skip {
            background: linear-gradient(135deg, #ffcc00, #d4af37);
            color: #06101E; border: none; border-radius: 10px; padding: 12px 20px;
            font-weight: 800; cursor: pointer;
        }

        .globo-container {
            width: 145px; height: 145px; margin: 25px auto; position: relative;
            border: 12px solid #ddd; border-radius: 50%; overflow: hidden;
            background: radial-gradient(circle at 40% 30%, rgba(255,255,255,0.35), #111);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 0 60px rgba(255,255,255,0.25);
        }
        .globo-inner {
            width: 100%; height: 100%; border-radius: 50%;
            animation: girarGlobo 0.9s linear infinite;
            background: repeating-radial-gradient(circle, transparent, transparent 11px, rgba(255,255,255,0.3) 11px, rgba(255,255,255,0.3) 13px);
        }
        .globo-blur {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 78px; height: 78px; border-radius: 50%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="78" height="78"><circle cx="22" cy="24" r="11" fill="%2328a745"/><circle cx="55" cy="27" r="10" fill="%23ffcc00"/><circle cx="38" cy="53" r="12" fill="%23ff3b30"/></svg>') center/contain no-repeat;
        }
        @keyframes girarGlobo { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }

        .ball {
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: white; font-size: 15px; box-shadow: inset 0 -5px 10px rgba(0,0,0,0.5);
            animation: cairQuicar 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes cairQuicar {
            0% { transform: translateY(-100px) scale(0.4); opacity: 0; }
            70% { transform: translateY(10px) scale(1.1); }
            100% { transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <!-- TELA INICIAL -->
    <div id="homeView" class="view">
        <div style="text-align:center; margin:20px 0 30px;">
            <svg viewBox="0 0 300 90" xmlns="http://www.w3.org/2000/svg" width="150">
                <circle cx="45" cy="45" r="35" fill="#209869"/>
                <path d="M45 18 C38 18 35 25 45 35 C55 25 52 18 45 18 Z M45 72 C52 72 55 65 45 55 C35 65 38 72 45 72 Z M18 45 C18 52 25 55 35 45 C25 35 18 38 18 45 Z M72 45 C72 38 65 35 55 45 C65 55 72 52 72 45 Z" fill="#ffffff"/>
                <circle cx="45" cy="45" r="5" fill="#209869"/>
                <text x="95" y="42" font-family="Arial Black" font-size="36" font-weight="900" fill="#ffffff">MEGA</text>
                <text x="95" y="78" font-family="Arial Black" font-size="36" font-weight="900" fill="#209869">SENA</text>
            </svg>
            <h1>Sistema Pro Ultra</h1>
            <p class="subtitle">Inteligência Matemática & Filtros de Pareto</p>
        </div>

        <div style="background:var(--card-bg); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:16px;">
            <label style="display:block; font-size:12px; color:var(--mega-green); text-transform:uppercase; margin-bottom:8px;">Tipo de Jogo</label>
            <select id="tipoJogo" onchange="calcularTempoReal()" style="width:100%; padding:16px; font-size:18px; border-radius:12px;">
                <option value="6">6 Dezenas (R$ 6,00)</option>
                <option value="7">7 Dezenas (R$ 35,00)</option>
            </select>
        </div>

        <div style="background:var(--card-bg); border:1px solid var(--border); border-radius:16px; padding:18px;">
            <label style="display:block; font-size:12px; color:var(--mega-green); text-transform:uppercase; margin-bottom:8px;">Quanto deseja investir? (R$)</label>
            <input type="number" id="valorInput" placeholder="Ex: 120" oninput="calcularTempoReal()" style="width:100%; padding:16px; font-size:20px; border-radius:12px;">
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:20px 0;">
            <div style="background:var(--card-bg); border-radius:14px; padding:16px; text-align:center; border:1px solid var(--border);">
                <span id="resJogos" style="font-size:26px; font-weight:800; color:var(--accent-gold);">0</span>
                <div style="font-size:11px; color:var(--text-dim);">CARTELAS</div>
            </div>
            <div style="background:var(--card-bg); border-radius:14px; padding:16px; text-align:center; border:1px solid var(--border);">
                <span id="resProb" style="font-size:15px; font-weight:700;">—</span>
                <div style="font-size:11px; color:var(--text-dim);">CHANCE COM SISTEMA</div>
            </div>
        </div>

        <button onclick="irParaSorteio()" style="background:linear-gradient(135deg,#25ba82,var(--mega-green)); color:white; border:none; border-radius:16px; padding:20px; font-size:18px; font-weight:800; width:100%;">🎟️ GERAR MEUS JOGOS AGORA</button>

        <button onclick="alternarResultados()" style="margin-top:12px; background:#1E344F; color:white; border:none; padding:16px; border-radius:12px; width:100%; font-weight:600;">Ver Últimos 10 Sorteios ▼</button>

        <div id="panelResults" class="hidden" style="margin-top:20px;">
            <div id="listaResultados"></div>
        </div>
    </div>

    <!-- TELA DE SORTEIO -->
    <div id="loadingView" class="view hidden">
        <div style="position:sticky; top:0; background:var(--bg-main); padding:12px 0; text-align:center; font-weight:bold; color:var(--accent-gold);">Sorteio em Andamento</div>
        
        <div class="globo-container" id="globoContainer">
            <div class="globo-inner"><div class="globo-blur" id="globoAlvo"></div></div>
        </div>
        <div id="statusTexto" style="text-align:center; color:var(--accent-gold); font-weight:700;">Girando o Globo...</div>

        <button onclick="pularTudo()" style="margin-top:20px; background:#ffcc00; color:#06101E; border:none; padding:12px 24px; border-radius:10px; font-weight:800; width:100%;">⚡ REVELAR TUDO</button>

        <div id="cardSorteioAtual" style="margin-top:20px; opacity:0;">
            <div id="tituloSorteioAtual" style="text-align:center; font-weight:bold;"></div>
            <div id="containerBolasSorteio" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:10px;"></div>
        </div>
    </div>

    <!-- TELA FINAL -->
    <div id="gamesView" class="view hidden">
        <div onclick="voltar()" style="color:var(--mega-green); cursor:pointer; font-weight:700;">⬅ Voltar</div>
        <h2 style="text-align:center; color:var(--accent-gold);">Seus Volantes</h2>
        <div id="gamesList"></div>
        <button onclick="narrarTodosJogos()" style="margin-top:20px; background:#1D62B4; color:white; border:none; padding:14px; border-radius:12px; width:100%;">🔊 Ouvir Todos os Jogos</button>
    </div>

    <script>
        let jogosGeradosCache = [];
        let abortarAnimacao = false;

        function obterCorNumero(num) {
            if (num % 3 === 1) return "#ffcc00";
            if (num % 3 === 2) return "#ff3b30";
            return "#28a745";
        }

        function calcularTempoReal() {
            const tipo = parseInt(document.getElementById('tipoJogo').value);
            const valor = parseFloat(document.getElementById('valorInput').value) || 0;
            const preco = tipo === 7 ? 35 : 6;
            const total = Math.floor(valor / preco);
            document.getElementById('resJogos').innerText = total;
            document.getElementById('resProb').innerText = total > 0 ? "1 em " + Math.round(2000000 / total).toLocaleString('pt-BR') : "—";
        }

        function irParaSorteio() {
            const total = parseInt(document.getElementById('resJogos').innerText);
            if (total < 1) return alert("Digite um valor maior!");

            jogosGeradosCache = [];
            for (let i = 0; i < total; i++) {
                let jogo = [];
                while (jogo.length < 6) {
                    let n = Math.floor(Math.random() * 60) + 1;
                    let str = n < 10 ? "0"+n : n.toString();
                    if (!jogo.includes(str)) jogo.push(str);
                }
                jogo.sort((a,b)=>a-b);
                jogosGeradosCache.push(jogo);
            }

            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('loadingView').classList.remove('hidden');
            animarSorteioCompleto(0);
        }

        function animarSorteioCompleto(index) {
            if (abortarAnimacao || index >= jogosGeradosCache.length) {
                mostrarJogosFinais();
                return;
            }

            const jogo = jogosGeradosCache[index];
            document.getElementById('tituloSorteioAtual').innerText = `Volante ${index+1}`;
            document.getElementById('cardSorteioAtual').style.opacity = "1";

            const container = document.getElementById('containerBolasSorteio');
            container.innerHTML = "";

            let i = 0;
            const timer = setInterval(() => {
                if (i < jogo.length) {
                    const bola = document.createElement('div');
                    bola.className = 'ball';
                    bola.style.background = obterCorNumero(parseInt(jogo[i]));
                    bola.textContent = jogo[i];
                    container.appendChild(bola);
                    i++;
                } else {
                    clearInterval(timer);
                    setTimeout(() => animarSorteioCompleto(index + 1), 900);
                }
            }, 550);
        }

        function pularTudo() {
            abortarAnimacao = true;
            mostrarJogosFinais();
        }

        function mostrarJogosFinais() {
            const list = document.getElementById('gamesList');
            list.innerHTML = "";
            jogosGeradosCache.forEach((jogo, i) => {
                const card = document.createElement('div');
                card.style.background = "var(--card-bg)";
                card.style.border = "1px solid var(--border)";
                card.style.borderRadius = "16px";
                card.style.padding = "16px";
                card.style.marginBottom = "16px";
                card.innerHTML = `
                    <strong>Volante ${i+1}</strong>
                    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;">
                        ${jogo.map(n => `<div class="ball" style="background:${obterCorNumero(parseInt(n))};animation:none;opacity:1;">${n}</div>`).join('')}
                    </div>
                `;
                list.appendChild(card);
            });

            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('gamesView').classList.remove('hidden');
        }

        function narrarTodosJogos() {
            if ('speechSynthesis' in window) {
                jogosGeradosCache.forEach((jogo, i) => {
                    setTimeout(() => {
                        const texto = `Volante ${i+1}. Números: ${jogo.join(', ')}`;
                        const utterance = new SpeechSynthesisUtterance(texto);
                        utterance.lang = 'pt-BR';
                        utterance.rate = 0.9;
                        speechSynthesis.speak(utterance);
                    }, i * 3000);
                });
            } else {
                alert("Seu navegador não suporta narração de voz.");
            }
        }

        // Últimos 10 com análises variadas
        function alternarResultados() {
            const painel = document.getElementById('panelResults');
            painel.classList.toggle('hidden');
            if (!painel.classList.contains('hidden')) carregar10Resultados();
        }

        function carregar10Resultados() {
            const lista = document.getElementById('listaResultados');
            lista.innerHTML = "";

            const resultados = [
                {c:3014, d:"01/06/2026", nums:["07","12","19","28","35","51"]},
                {c:3013, d:"30/05/2026", nums:["02","14","21","22","34","44"]},
                {c:3012, d:"28/05/2026", nums:["05","17","23","41","42","49"]},
                {c:3011, d:"26/05/2026", nums:["03","09","27","36","40","60"]},
                {c:3010, d:"24/05/2026", nums:["08","15","30","33","45","58"]},
                {c:3009, d:"22/05/2026", nums:["11","18","25","32","39","47"]},
                {c:3008, d:"20/05/2026", nums:["04","16","22","31","38","55"]},
                {c:3007, d:"18/05/2026", nums:["06","13","24","29","43","52"]},
                {c:3006, d:"16/05/2026", nums:["10","20","26","37","46","59"]},
                {c:3005, d:"14/05/2026", nums:["01","15","23","34","41","50"]}
            ];

            resultados.forEach(r => {
                const row = document.createElement('div');
                row.style.marginBottom = "28px";
                row.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <strong>Concurso ${r.c}</strong>
                        <span>${r.d}</span>
                    </div>
                    <div style="display:flex; gap:6px; justify-content:center; margin:12px 0;">
                        ${r.nums.map(n => `<div class="ball" style="background:${obterCorNumero(parseInt(n))}; animation:none; opacity:1; width:34px; height:34px; font-size:13px;">${n}</div>`).join('')}
                    </div>
                    <div style="background:rgba(32,152,105,0.15); padding:14px; border-radius:12px; font-size:13.8px; line-height:1.5;">
                        ${gerarAnaliseVariada(r.nums)}
                    </div>
                `;
                lista.appendChild(row);
            });
        }

        function gerarAnaliseVariada(dezenas) {
            const quentes = [7,12,19,28,35,51,02,14,21,22,34,44,05,17,23,41,42,49];
            const matches = dezenas.filter(d => quentes.includes(parseInt(d))).length;
            
            if (matches >= 4) return "🔥 Excelente alinhamento com dezenas quentes! Nosso sistema teria alta chance de Quadra ou Quina neste concurso.";
            if (matches >= 3) return "📈 Bom desempenho. Vários números quentes saíram. O Sistema Pro Ultra teria capturado bem este sorteio.";
            return "⚡ Equilíbrio moderado. Com nossos filtros de Pareto, ainda teríamos boa cobertura neste resultado.";
        }

        function voltar() {
            document.getElementById('gamesView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
        }

        window.onload = () => {
            calcularTempoReal();
        };
    </script>
</body>
</html>
